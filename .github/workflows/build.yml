name: Veyra Windows installer
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ayugram-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[bootstrap]')
    # A cold upstream dependency build is large. Set this repository variable to a
    # dedicated runner label when the hosted runner's disk/time limits are insufficient.
    runs-on: ${{ vars.WINDOWS_BUILD_RUNNER || 'windows-2025' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      # Same example credentials as upstream docs/building-win.md. For distribution,
      # replace both with your own Telegram application credentials in repository vars.
      TDESKTOP_API_ID: ${{ vars.TDESKTOP_API_ID || '2040' }}
      TDESKTOP_API_HASH: ${{ vars.TDESKTOP_API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          path: tdesktop
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Keep CPython SDK separate from upstream build-tools Python
        run: |
          $sdk = Split-Path (Get-Command python).Source
          "AYU_PYTHON_SDK=$sdk" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Install build tooling
        run: |
          python -m pip install cmake==3.31.6 ninja==1.11.1.4
          if ($LASTEXITCODE -ne 0) { throw 'Build-tool installation failed' }
      - name: Select VS 2022 v143 with matching ATL and MFC
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          function Find-VS {
            $candidates = & $vswhere -all -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.ATL Microsoft.VisualStudio.Component.VC.ATLMFC -format json | ConvertFrom-Json
            foreach ($candidate in $candidates) {
              $tools = Join-Path $candidate.installationPath 'VC\Tools\MSVC'
              foreach ($tool in @(Get-ChildItem $tools -Directory -Filter '14.44.*' -ErrorAction SilentlyContinue)) {
                if ((Test-Path (Join-Path $tool.FullName 'atlmfc\include\atlbase.h')) -and (Test-Path (Join-Path $tool.FullName 'atlmfc\include\atlcomcli.h'))) {
                  return $candidate.installationPath
                }
              }
            }
            return $null
          }
          $vs = Find-VS
          if (!$vs) {
            $installer = Join-Path $env:RUNNER_TEMP 'vs2022-buildtools.exe'
            Invoke-WebRequest 'https://aka.ms/vs/17/release/vs_buildtools.exe' -OutFile $installer
            $installPath = Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\VeyraBuildTools'
            $arguments = '--quiet --wait --norestart --nocache --installPath "' + $installPath + '" --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.ATLMFC --add Microsoft.VisualStudio.Component.Windows11SDK.26100 --includeRecommended'
            $process = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "VS 2022 installation failed: $($process.ExitCode)" }
            $vs = Find-VS
          }
          if (!$vs) { throw 'VS 2022 with MSVC 14.44 and matching ATL/MFC headers was not found; refusing a long dependency build.' }
          "VEYRA_VS_INSTALL=$vs" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR_INSTANCE=$vs" >> $env:GITHUB_ENV
          "GYP_MSVS_OVERRIDE_PATH=$vs" >> $env:GITHUB_ENV
          'GYP_MSVS_VERSION=2022' >> $env:GITHUB_ENV
          Write-Host "Selected VS 2022: $vs"
      - name: Restore prepared upstream dependencies
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          # prepare.py also has per-library invalidation keys; never cache source/out.
          key: veyra-win64-vs17-atl-qt6-${{ runner.os }}-${{ hashFiles('tdesktop/Telegram/build/prepare/**', 'tdesktop/Telegram/build/qt_version.py', 'tdesktop/.gitmodules') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            veyra-win64-vs17-atl-qt6-${{ runner.os }}-${{ hashFiles('tdesktop/Telegram/build/prepare/**', 'tdesktop/Telegram/build/qt_version.py', 'tdesktop/.gitmodules') }}-
      - name: Prepare dependencies, compile integrated client and package installer
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = $env:VEYRA_VS_INSTALL
          if (!$vs) { throw 'Pinned VS 2022 environment was not selected' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tdesktop\scripts\windows\build.ps1'
          $batch = Join-Path $env:RUNNER_TEMP 'ayu-build.cmd'
          @"
          @echo off
          call "$vcvars" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          if not exist "%VCToolsInstallDir%atlmfc\include\atlbase.h" exit /b 2
          if not exist "%VCToolsInstallDir%atlmfc\include\atlcomcli.h" exit /b 2
          set "INCLUDE=%VCToolsInstallDir%atlmfc\include;%INCLUDE%"
          set "LIB=%VCToolsInstallDir%atlmfc\lib\x64;%LIB%"
          pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$script"
          exit /b %errorlevel%
          "@ | Set-Content $batch -Encoding ascii
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'build-logs') | Out-Null
          & cmd.exe /d /c $batch 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE 'build-logs/driver.log')
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed ($LASTEXITCODE)" }
      - name: Save dependency checkpoint even if a later stage fails
        if: always() && steps.dependencies.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Upload installer and portable client
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish downloadable installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "plugins-build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $notes = "Unsigned Windows x64 installer and portable client. Source: $env:GITHUB_SHA. CPython plugins execute trusted code in-process; no sandbox. Real-account functional testing is not automated."
          $assets = @(Get-ChildItem ./artifacts -File | Where-Object { $_.Extension -in @('.exe', '.zip') -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 3) { throw 'Installer, portable ZIP and checksums must all exist' }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Veyra Desktop Windows build $env:GITHUB_RUN_NUMBER" --notes $notes --prerelease @assets
          if ($LASTEXITCODE -ne 0) { throw 'Installer release publication failed' }
      - name: Expose native build failure details
        if: failure()
        run: |
          $files = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'build-logs') -Filter '*.log' -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $tail = (Get-Content $file.FullName -Tail 65 -ErrorAction SilentlyContinue) -join "`n"
            if ($tail.Length -gt 14000) { $tail = $tail.Substring($tail.Length - 14000) }
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=$($file.Name)::$tail"
          }
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-build-diagnostics
          path: |
            tdesktop/out/CMakeFiles/CMakeConfigureLog.yaml
            build-logs/
          if-no-files-found: ignore
          retention-days: 7
